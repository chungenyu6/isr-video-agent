name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    # Fails the build rather than publish a leak or a number the experiment did
    # not produce. Runs before anything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install validator dependency
        run: pip install --quiet jsonschema

      - name: Validate every bundle (schema + leak + sanity)
        run: python tools/validate_bundle.py bundles/*/

      - name: Site figures must equal the final report
        run: python tools/build_experiment.py --check

      - name: Exactly the 56 formal runs, and no live run
        run: |
          n=$(ls -d bundles/fd-pi-discovery-*/ bundles/fd-pi-confirmation-*/ | wc -l)
          total=$(ls -d bundles/*/ | wc -l)
          echo "formal=$n total=$total"
          test "$n" -eq 56 && test "$total" -eq 56

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Refuse to publish host paths or credentials
        # Scans the BUILT SITE, which is what gets published.
        run: |
          if grep -rIl -e '/home/' -e '/root/' -e 'auth.json' app/dist ; then
            echo "::error::host path or credential reference found in the built site"
            exit 1
          fi
          echo "built site is clean"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
