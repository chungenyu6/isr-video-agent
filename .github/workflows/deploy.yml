name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    # Fails the build rather than publish a leak or a number the experiment did
    # not produce. Runs before anything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install validator dependency
        run: pip install --quiet jsonschema

      - name: Validate every bundle (schema + leak + sanity)
        run: python tools/validate_bundle.py bundles/*/

      - name: Site figures must equal the final report
        run: python tools/build_experiment.py --check

      - name: Published bundles match experiment.json, and no live run
        # The ISR line has no fixed matrix size to assert, so assert the two
        # things that must hold however many runs there are: every bundle on
        # disk is listed in experiment.json, and nothing live slipped in.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          exp = json.loads(pathlib.Path("content/experiment.json").read_text())
          listed = sorted(r["bundle"] for r in exp["runs"])
          on_disk = sorted(p.parent.name for p in pathlib.Path("bundles").glob("*/bundle.json"))
          live = [p.parent.name for p in pathlib.Path("bundles").glob("*/bundle.json")
                  if json.loads(p.read_text()).get("live")]
          bad = []
          if listed != on_disk:
              bad.append(f"listed={listed}\non_disk={on_disk}")
          if live:
              bad.append(f"live runs must not be published: {live}")
          print(f"{len(on_disk)} bundles, {len(listed)} listed, {len(live)} live")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Refuse to publish host paths or credentials
        # Scans the BUILT SITE, which is what gets published.
        run: |
          if grep -rIl -e '/home/' -e '/root/' -e 'auth.json' app/dist ; then
            echo "::error::host path or credential reference found in the built site"
            exit 1
          fi
          echo "built site is clean"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
